[build]
  publish = "out"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Known routes are prerendered to /route/index.html.
# Existing static files are served first; unknown URLs receive a real 404.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

